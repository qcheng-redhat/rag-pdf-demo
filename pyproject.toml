[project]
name = "pdf-rag"
version = "0.1.0"
description = "CLI RAG over PDFs in a folder"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "openai>=1.40.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=2.7.0",
]

[project.scripts]
pdf-rag = "pdf_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_rag"]
